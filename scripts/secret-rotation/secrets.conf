# Secrets to rotate, one per line. The script prompts once per name and writes
# that value to every repository listed in repos.conf.
#
#   NAME              -> repository-level secret
#   NAME@environment  -> environment-level secret (the environment must already exist)
#
# Environment secrets override repository secrets of the same name for jobs that
# declare that environment. Only use the @env form when you need a per-environment value.

AZURE_CLIENT_ID
AZURE_TENANT_ID
AZURE_SUBSCRIPTION_ID
