# Variables to rotate, one per line. The script prompts once per name and writes
# that value to every repository listed in repos.conf.
#
#   NAME              -> repository-level variable
#   NAME@environment  -> environment-level variable (the environment must already exist)
#
# Variables are plaintext — visible in GitHub UI and workflow logs unless masked.
# Use secrets.conf for anything sensitive.
#
# Examples:
# AZURE_WEBAPP_NAME
# NODE_VERSION
# SECRET1@production
MY_VARIABLE