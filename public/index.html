<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
    }
    h1 { font-size: 3rem; margin: 1rem 0 0.25rem; }
    p { opacity: 0.8; margin: 0; }
    svg { width: 180px; height: 180px; }
    .sun { animation: spin 12s linear infinite; transform-origin: 90px 90px; }
    .cloud { animation: drift 4s ease-in-out infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes drift { from { transform: translateX(-8px); } to { transform: translateX(8px); } }
  </style>
</head>
<body>
  <svg viewBox="0 0 180 180" aria-hidden="true">
    <g class="sun">
      <circle cx="90" cy="90" r="36" fill="#ffc83d"/>
      <g stroke="#ffc83d" stroke-width="6" stroke-linecap="round">
        <line x1="90" y1="20" x2="90" y2="40"/>
        <line x1="90" y1="140" x2="90" y2="160"/>
        <line x1="20" y1="90" x2="40" y2="90"/>
        <line x1="140" y1="90" x2="160" y2="90"/>
        <line x1="40" y1="40" x2="54" y2="54"/>
        <line x1="126" y1="126" x2="140" y2="140"/>
        <line x1="40" y1="140" x2="54" y2="126"/>
        <line x1="126" y1="54" x2="140" y2="40"/>
      </g>
    </g>
    <g class="cloud" fill="#ffffff">
      <ellipse cx="110" cy="128" rx="40" ry="18"/>
      <circle cx="95" cy="116" r="18"/>
      <circle cx="120" cy="110" r="22"/>
    </g>
  </svg>
  <h1>Hello, World!</h1>
  <p>Running on Azure App Service &middot; app-web-demo1</p>
</body>
</html>
